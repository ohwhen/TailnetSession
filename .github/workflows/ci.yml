name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  local-binary:
    name: Build TailscaleKit and test the package against it
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned libtailscale commit
        id: ref
        run: echo "sha=$(tr -d '[:space:]' < tailscale.ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: tailscale/libtailscale
          ref: ${{ steps.ref.outputs.sha }}
          path: .build/libtailscale

      - uses: actions/setup-go@v5
        with:
          go-version-file: .build/libtailscale/go.mod
          cache-dependency-path: .build/libtailscale/go.sum

      - name: Restore a previous build of this exact recipe
        id: cache
        uses: actions/cache@v4
        with:
          path: build
          key: tailscalekit-${{ runner.os }}-${{ hashFiles('tailscale.ref', 'Scripts/build-xcframework.sh', 'Resources/PrivacyInfo.xcprivacy') }}

      - name: Build TailscaleKit.xcframework
        if: steps.cache.outputs.cache-hit != 'true'
        run: Scripts/build-xcframework.sh

      - name: Test on the iOS simulator
        env:
          TAILSCALEKIT_XCFRAMEWORK: build/TailscaleKit.xcframework
        run: Scripts/test.sh

  published-binary:
    name: Resolve and test against the published release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test on the iOS simulator
        run: Scripts/test.sh
